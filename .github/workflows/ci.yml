name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore CashFlow.sln
      - name: Format
        run: dotnet format CashFlow.sln --no-restore --verify-no-changes
      - name: Build
        run: dotnet build CashFlow.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test CashFlow.sln --configuration Release --no-build --logger "trx;LogFileName=tests.trx"
      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/*.trx"
